# Proves the iPhone and Android builds work from apps/web, before the monorepo move (Phase 2).
# Moves the app into apps/web inside the runner only, then runs the normal Android and iPhone simulator workflows there.
# Nothing in the repo changes. Run it from the Actions tab, or it runs when this file or the build scripts change.
name: Phone builds in the monorepo layout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mobile-layout-check.yml", ".github/scripts/**"]

jobs:
  android:
    uses: ./.github/workflows/android.yml
    with:
      app_dir: apps/web
      simulate_monorepo: true
    secrets: inherit
  iphone:
    uses: ./.github/workflows/ios-simulator.yml
    with:
      app_dir: apps/web
      simulate_monorepo: true
