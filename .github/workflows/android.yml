# Builds the Android app, runs it on an Android emulator (launch + screenshots), and, when the Play
# keys are set, signs it and uploads it to the Play Console internal testing track.
#
# Optional repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  (upload key)
#   GOOGLE_SERVICES_JSON          Optional override; android/app/google-services.json is committed (Firebase config, not secret)
#   PLAY_SERVICE_ACCOUNT_JSON     Google Play service account allowed to upload releases
name: Android app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in Google Play (e.g. 1.0)"
        required: true
        default: "1.0"
      upload:
        description: "Upload to the Play internal testing track (needs Play keys)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["android/**", "apps/*/android/**", "capacitor.config.ts", "apps/*/capacitor.config.ts", ".github/workflows/android.yml"]
  # Called by mobile-layout-check.yml to prove the build still works after the monorepo move.
  workflow_call:
    inputs:
      app_dir:
        type: string
        default: ""
      simulate_monorepo:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_VERSION_NAME: ${{ github.event.inputs.version || '1.0' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Folder that holds capacitor.config.ts, android/ and ios/. "." today; "apps/web" after the monorepo move.
      # Set the MOBILE_APP_DIR repository variable at cutover; no workflow edit needed.
      APP_DIR: ${{ inputs.app_dir || vars.MOBILE_APP_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4
      - name: Simulate the monorepo layout (test only)
        if: inputs.simulate_monorepo
        run: bash .github/scripts/simulate-monorepo.sh "$APP_DIR"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: bash .github/scripts/install.sh "$APP_DIR"
      - name: Sync the native project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Firebase config (phone alerts)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        working-directory: ${{ env.APP_DIR }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Check 16 KB page support
        # Google Play blocks updates without it from Feb 1, 2027. Every native library in the release bundle
        # must have ELF LOAD segments aligned to at least 16 KB (0x4000).
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          rm -rf "$RUNNER_TEMP/aab" && mkdir -p "$RUNNER_TEMP/aab" && unzip -q "$AAB" -d "$RUNNER_TEMP/aab"
          bad=0; n=0
          for so in $(find "$RUNNER_TEMP/aab" -name "*.so"); do
            n=$((n+1))
            for a in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((a)) -lt $((0x4000)) ]; then echo "NOT 16 KB aligned: ${so#$RUNNER_TEMP/aab/} ($a)"; bad=1; fi
            done
          done
          echo "Checked $n native libraries."
          [ "$bad" = 0 ] && echo "16 KB PAGE CHECK PASSED"
          exit $bad

      - name: Turn on hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          working-directory: ${{ env.APP_DIR }}
          script: |
            mkdir -p shots
            for i in $(seq 1 30); do adb shell ping -c 1 -W 2 www.takeitback.app >/dev/null 2>&1 && echo "EMULATOR ONLINE" && break; sleep 4; done
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n app.takeitback/.MainActivity
            sleep 35
            adb exec-out screencap -p > shots/android-launch.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb pull /sdcard/ui.xml shots/android-ui.xml >/dev/null 2>&1 || true
            # The site renders inside a WebView; Android's accessibility tree exposes its text when it has loaded.
            grep -qi "Welcome back\|Sign in" shots/android-ui.xml && echo "SIGN-IN PAGE LOADED" || echo "Page text not exposed; check shots/android-launch.png"
            adb shell pidof app.takeitback && echo "APP RUNNING" || (echo "APP NOT RUNNING" && exit 1)
            adb shell dumpsys window | grep -E "mCurrentFocus" || true
            adb logcat -d -s Capacitor:* chromium:* AndroidRuntime:E > shots/logcat.txt || true
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb exec-out screencap -p > shots/android-after-back.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build${{ inputs.simulate_monorepo && '-monorepo' || '' }}
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
            ${{ env.APP_DIR }}/shots/

      - name: Upload to Play internal testing
        if: github.event.inputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.takeitback
          releaseFiles: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
